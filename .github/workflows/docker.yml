name: docker-build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t alpha-console:ci .

      - name: Smoke test container health
        run: |
          docker run -d --name smoke -p 8765:8765 alpha-console:ci
          sleep 12
          curl -sf http://localhost:8765/health || (docker logs smoke && exit 1)
          docker stop smoke
