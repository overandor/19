name: feedback-ingest

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize feedback event
        run: |
          python scripts/feedback_classifier.py
      - name: Build improvement proposal
        run: |
          python scripts/proposal_writer.py
      - name: Commit proposal artifacts
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add feedback_ingest/*.json improvement_proposals/*.json
          git commit -m "ingest: proposal artifacts" || echo "no changes"
          git push || true
