name: governance

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: governance
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce policy file exists
        run: test -f safety_policies/RESEARCH_GUARDRAILS.md
      - name: Verify no auto-merge directives
        run: |
          ! rg -n "auto-merge|merge without review" .github/workflows || (echo "unsafe directive found" && exit 1)

  publish-governance-state:
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build governance state
        run: |
          python scripts/llm_governor.py
      - name: Commit governance state
        run: |
          git config user.name "research-governor"
          git config user.email "research-governor@users.noreply.github.com"
          git add cache/governance_state.json
          git commit -m "governance: refresh research state" || echo "no changes"
          git push || true

  alert-on-fail:
    if: ${{ failure() }}
    needs: [guardrails, publish-governance-state]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Governance guardrail failure',
              body: 'A governance workflow failed or violated a policy check.'
            })
