name: harvest
on:
  schedule:
    - cron: '*/3 0-22 * * *'
  push:
    branches: [ main ]
permissions:
  contents: write
concurrency:
  group: harvest
  cancel-in-progress: true
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall backend.py scripts
      - name: Combinatorics prompting (local LLM optional)
        env:
          LLM_BIN: ollama
          LLM_MODEL: codellama:13b
        run: |
          python scripts/prompt_combinator.py || echo "LLM rank fallback"
      - name: Harvest signals (read-only)
        run: python scripts/harvest_signals.py
      - name: Build container image
        if: github.event_name != 'schedule'
        run: docker build -t alpha-console .
      - name: Commit artifacts
        run: |
          git config user.name "cortex-bot"
          git config user.email "cortex-bot@users.noreply.github.com"
          git add signals.json SHASUMS256.txt .last_harvest_utc
          git commit -m "signals: $(date -u +%FT%TZ)" || echo "no changes"
          git push
