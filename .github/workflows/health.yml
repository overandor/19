name: governance-health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required governance files
        run: |
          test -f safety_policies/research_only_policy.md
          test -f improvement_proposals/schema/improvement_proposal.schema.json
          test -f candidate_signal_registry/schema/candidate_signal.schema.json
          echo "governance baseline present"
