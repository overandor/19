version: "3.9"
services:
  backend:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./signals.json:/shared/signals.json
      - ./cache:/shared/cache
    environment:
      SHARED_DATA_DIR: /shared
    restart: unless-stopped
  dashboard:
    image: caddy:2.7.6-alpine
    depends_on:
      - backend
    volumes:
      - ./index.html:/shared/index.html:ro
      - ./signals.json:/shared/signals.json:ro
      - ./cache:/shared/cache:ro
    environment:
      CADDY_GLOBAL_OPTIONS: ""
    command: ["caddy", "file-server", "--root", "/shared", "--listen", ":8080"]
    ports:
      - "8080:8080"
    restart: unless-stopped
