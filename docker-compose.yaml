version: "3.9"
services:
  backend:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./signals.json:/app/signals.json
      - ./cache:/app/cache
    environment:
      DATA_ROOT: /app
      SIGNALS_PATH: /app/signals.json
      FOCUS_PATH: /app/cache/focus.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    image: caddy:2.7.6-alpine
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./index.html:/usr/share/caddy/index.html:ro
      - ./signals.json:/usr/share/caddy/signals.json:ro
      - ./cache:/usr/share/caddy/cache:ro
    command: ["caddy", "file-server", "--root", "/usr/share/caddy", "--listen", ":8080"]
    ports:
      - "8080:8080"
    restart: unless-stopped
