version: "3.9"
services:
  backend:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - shared-data:/data
    environment:
      DATA_ROOT: /data
      SIGNALS_PATH: /data/signals.json
      FOCUS_PATH: /data/cache/focus.json
    restart: unless-stopped
  dashboard:
    image: caddy:2.7.6-alpine
    depends_on:
      - backend
    volumes:
      - shared-data:/data:ro
      - ./index.html:/data/index.html:ro
    environment:
      CADDY_GLOBAL_OPTIONS: ""
    command: ["caddy", "file-server", "--root", "/data", "--listen", ":8080"]
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  shared-data:
