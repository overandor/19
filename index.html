<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Green Miracle 2085 — Neomorph Vegan Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    --bg: #e9f5ee;
    --fg: #1b3d2f;
    --accent: #4ade80;
    background: var(--bg);
    color: var(--fg);
    font-family: "Poppins", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 0;
    margin: 0;
  }
  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
  }

  function backendBase(){
    const params=new URLSearchParams(window.location.search);
    const api=params.get('api');
    if(api){
      try{ return new URL(api).toString().replace(/\/$/,''); }catch(_){ /* ignore */ }
    }
    const host=window.location.hostname||'localhost';
    const proto=window.location.protocol==='https:'?'https:':'http:';
    return `${proto}//${host}:8765`;
  }

  function inferWsUrl(){
    const manual=wsInput.value.trim();
    if(manual) return manual;
    const params=new URLSearchParams(window.location.search);
    const param=params.get('ws');
    if(param) return param;
    const base=new URL(backendBase());
    base.protocol=base.protocol==='https:'?'wss:':'ws:';
    base.pathname='/ws';
    return base.toString();
  }
  .container {
    width: 90%;
    max-width: 800px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-radius: 25px;
    box-shadow: 10px 10px 20px #cdded3, -10px -10px 20px #ffffff;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  #chat-box {
    flex-grow: 1;
    overflow-y: auto;
    padding: 1rem;
  }
  .bubble {
    margin: 0.5rem 0;
    padding: 0.75rem 1rem;
    border-radius: 20px;
    box-shadow: inset 4px 4px 8px #d0e0d4, inset -4px -4px 8px #ffffff;
    max-width: 75%;
    line-height: 1.4;
    animation: fadeIn 0.3s ease;
  }

  function connect(){
    if(socket){
      manualClose=true;
      socket.close();
      socket=null;
      setStatus(false);
      return;
    }
    const url=inferWsUrl();
    appendLog(`connecting ${url}`);
    socket=new WebSocket(url);
    socket.addEventListener('open',()=>{
      setStatus(true);
      appendLog('websocket open');
      if(!reconnecting){
        requestFocus(false);
        requestSignals(false);
      }
      reconnecting=false;
    });
    socket.addEventListener('close',()=>{
      appendLog('websocket closed');
      setStatus(false);
      if(socket){
        socket=null;
        if(manualClose){
          manualClose=false;
          return;
        }
        setTimeout(()=>{reconnecting=true;connect();},2500);
      }
    });
    socket.addEventListener('error',err=>{
      appendLog(`websocket error ${err.message||err}`);
    });
    socket.addEventListener('message',handleMessage);
  }
  .bot {
    align-self: flex-start;
    background: linear-gradient(145deg,#f0fdf4,#dcfce7);
  }
  footer {
    width: 100%;
    max-width: 800px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem;
    border-radius: 20px;
    background: var(--bg);
    box-shadow: inset 6px 6px 12px #cdded3, inset -6px -6px 12px #ffffff;
    margin-bottom: 2rem;
  }
  input[type="text"] {
    flex-grow: 1;
    background: var(--bg);
    border: none;
    outline: none;
    padding: 0.75rem 1rem;
    border-radius: 15px;
    box-shadow: inset 3px 3px 6px #cdded3, inset -3px -3px 6px #ffffff;
    margin-right: 1rem;
  }

  async function fallbackRequest(kind){
    const base=backendBase();
    if(kind==='focus'){
      appendLog('fallback focus via /focus');
      try{
        const res=await fetch(base+'/focus',{method:'POST',cache:'no-store'});
        if(res.ok){
          renderFocus(await res.json());
          return;
        }
      }catch(_){ }
      try{
        const res=await fetch('cache/focus.json?cb='+Date.now());
        if(res.ok){
          renderFocus(await res.json());
        }
      }catch(err){
        appendLog(`focus fallback failed ${err}`);
      }
    }else if(kind==='scan'){
      appendLog('fallback scan via /scan');
      try{
        const res=await fetch(base+'/scan',{method:'POST',cache:'no-store'});
        if(res.ok){
          renderSignals(await res.json());
          return;
        }
      }catch(_){ }
      try{
        const res=await fetch('signals.json?cb='+Date.now());
        if(res.ok){
          renderSignals(await res.json());
        }
      }catch(err){
        appendLog(`scan fallback failed ${err}`);
      }
    }
  }
  @keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
  }
</style>
</head>
<body>
<header>
  <h1>🌿 Green Miracle 2085 — BackUIX / Neomorph Vegan Edition</h1>
  <p class="text-sm text-green-700">Adaptive organic intelligence interface</p>
</header>

<div class="container flex flex-col">
  <div id="chat-box" class="flex flex-col"></div>
</div>

<footer>
  <input id="user-input" type="text" placeholder="Speak your green thought..." />
  <input id="file-input" type="file" class="upload" />
  <button id="send-btn">Send</button>
</footer>

<script>
const chatBox=document.getElementById('chat-box');
const userInput=document.getElementById('user-input');
const sendBtn=document.getElementById('send-btn');
const fileInput=document.getElementById('file-input');
let usefulness=0, fileData=null;

function bubble(text,role){
  const div=document.createElement('div');
  div.className=`bubble ${role}`;
  div.textContent=text;
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}

fileInput.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    fileData=r.result.slice(0,300);
    bubble(`File "${f.name}" uploaded.`, 'bot');
  };
  r.readAsText(f);
});

async function sendMessage(){
  const text=userInput.value.trim(); if(!text) return;
  bubble(text,'user'); userInput.value='';
  bubble('🌱 Processing...','bot');
  await new Promise(r=>setTimeout(r,600));
  let reply=generateLocalReply(text);
  const last=chatBox.querySelector('.bot:last-child');
  last.textContent=reply;
  const fb=document.createElement('div');
  fb.innerHTML=`<button onclick="adjust(1)">👍</button> <button onclick="adjust(-1)">👎</button>`;
  last.appendChild(fb);
}

function adjust(delta){
  usefulness+=delta;
  bubble(`Usefulness calibration: ${usefulness}`,'bot');
}

function generateLocalReply(input){
  const positive=["Wonderful!","Brilliant energy!","The soil approves."];
  const neutral=["Understood.","Processing organic data.","Noted in chlorophyll memory."];
  const gentle=["Take a deep breath of green.","Harmony restored.","Let's reconnect with sunlight."];
  let base=neutral[Math.floor(Math.random()*neutral.length)];
  if(input.match(/tree|plant|earth|eco|green/i)) base=positive[Math.floor(Math.random()*positive.length)];
  if(usefulness<-2) base=gentle[Math.floor(Math.random()*gentle.length)];
  if(fileData) base+=" (Your file’s essence integrated.)";
  return `🤖 ${base}`;
}

sendBtn.onclick=sendMessage;
userInput.addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage();});
</script>
</body>
</html>
